name: Verify Rallly Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v4.16.4
permissions:
  contents: read
concurrency:
  group: rallly-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.rallly-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.rallly', info['package']
              assert info['name'] == 'Rallly', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'AGPL-3.0', info['license']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'rallly', app['subdomain']
              upstreams = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://rallly:3000/' for u in upstreams), upstreams

              svcs = m['services']
              assert set(svcs) == {'db', 'rallly'}, set(svcs)

              # app service: mirrored image pinned to this release
              app_svc = svcs['rallly']
              assert 'lukevella/rallly:' + tag.lstrip('v') in app_svc['image'], app_svc['image']
              env = ' '.join(app_svc['environment'])
              assert 'DATABASE_URL=postgres://' in env
              assert 'NEXT_PUBLIC_BASE_URL' in env
              assert 'SELF_HOSTED=true' in env

              # no hardcoded password: db password must come from stable_secret
              assert 'stable_secret' in env, env
              assert 'rallly_db_password' in env, env

              # db service present with its own healthcheck, app must not add one
              db = svcs['db']
              assert 'postgres:18-alpine' in db['image'], db['image']
              assert 'healthcheck' in db, db
              assert 'healthcheck' not in app_svc, app_svc

              # no file interceptor / startup gate added
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text
              assert 'deploy_params.yml' not in members, members

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  license_text = content.extractfile(lic[0]).read().decode()
              assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
